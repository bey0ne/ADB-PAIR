name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe bash
        run: bash -n adb-pair.sh && bash -n install.sh
      - name: ShellCheck
        run: shellcheck -S warning -e SC2034 adb-pair.sh install.sh
